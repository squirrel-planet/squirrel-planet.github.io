<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十字格纹卡片</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f0f2f5;
  font-family: system-ui, -apple-system, sans-serif;
  padding: 40px;
}

.container {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  justify-content: center;
  max-width: 1200px;
}

.card {
  width: 200px;
  height: 200px;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.15);
}

.card-dark {
  background:
    repeating-linear-gradient(90deg, rgba(180,180,180,0.3) 0px, rgba(180,180,180,0.3) 12px, transparent 12px, transparent 24px),
    repeating-linear-gradient(0deg, rgba(180,180,180,0.18) 0px, rgba(180,180,180,0.18) 12px, transparent 12px, transparent 24px),
    rgb(42, 40, 40);
}

.card-gold {
  background:
    repeating-linear-gradient(90deg, rgba(180,180,180,0.4) 0px, rgba(180,180,180,0.4) 12px, transparent 12px, transparent 24px),
    repeating-linear-gradient(0deg, rgba(180,180,180,0.25) 0px, rgba(180,180,180,0.25) 12px, transparent 12px, transparent 24px),
    rgb(255, 177, 20);
}
</style>
</head>
<body>
<div class="container">
  <div class="card card-dark"></div>
  <div class="card card-gold"></div>
  <div class="card card-dark"></div>
  <div class="card card-gold"></div>
  <div class="card card-dark"></div>
  <div class="card card-gold"></div>
  <div class="card card-dark"></div>
  <div class="card card-gold"></div>
  <div class="card card-dark"></div>
  <div class="card card-gold"></div>
</div>
</body>
</html>
